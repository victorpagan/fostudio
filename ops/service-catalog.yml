service:
  slug: fostudio
  display_name: FO Studio
  repo: /Users/vic/Documents/Github/fostudio
  runtime:
    type: nuxt
    version: "Nuxt 4 on Node"
    package_manager: pnpm
    app_root: "."
  hosting:
    provider: Heroku
    team: film-objektiv
    app: fostudio
    web_url: "https://fostudio-2472c7fb148b.herokuapp.com/"
    public_site_url_default: "https://fo.studio"
  deploy:
    method: "pnpm build; pnpm start"
    artifact: ".output/server/index.mjs"
    build_env:
      NODE_OPTIONS: "--max-old-space-size=8192"
  reachability:
    public: true
    private: true
    note: "Public booking/marketing routes plus admin/internal API routes."
  health:
    health_url: "https://fostudio-2472c7fb148b.herokuapp.com/health"
    ready_url: "https://fostudio-2472c7fb148b.herokuapp.com/ready"
    heartbeat_key: null
    subsystem_status:
      access_queue: "/api/admin/access/status"
      access_dead_job_retry: "/api/admin/access/jobs.retry"
    note: "Public /health checks host reachability. Public /ready checks Supabase readiness using server-side service-role access."
    status_language: [Up, Ready, Delayed, Degraded, Blocked, Down]
  dependencies:
    supabase:
      project_ref: kvkfqcxfknsyrzonoplg
      tables_read:
        - orders2
        - system_config
        - membership_plan_variations
        - membership_tiers
        - promo_codes
        - mail_template_registry
        - mail_user_preferences
        - mail_admin_copy_preferences
      tables_written:
        - admin_expense_reports
        - admin_incident_reports
        - admin_manual_membership_events
        - admin_member_charges
        - analytics_ad_daily
        - analytics_outputs
        - app_error_events
        - app_error_groups
        - booking_access_codes
        - booking_holds
        - bookings
        - calendar_blocks
        - credit_balance
        - credit_pricing_options
        - credit_topup_sessions
        - credits_ledger
        - customers
        - door_code_change_requests
        - external_calendar_events
        - hold_balance
        - hold_ledger
        - hold_topup_sessions
        - lock_access_incidents
        - lock_access_jobs
        - lock_permanent_codes
        - lock_slot_assignments
        - mail_campaign_template_id_history
        - mail_campaign_templates
        - mail_campaigns
        - mail_reminder_deliveries
        - mail_reminder_rules
        - member_referral_codes
        - member_waiver_signatures
        - membership_checkout_sessions
        - membership_credit_grants
        - membership_plan_variations
        - membership_referrals
        - membership_tiers
        - membership_waitlist
        - memberships
        - promo_codes
        - referral_credit_rules
        - waiver_templates
      rpc:
        - get_secret
        - create_confirmed_booking_with_burn_and_rate
        - create_confirmed_booking_with_burn_no_membership_and_rate
    external:
      - Square API and webhooks
      - fomailer
      - SendGrid
      - Home Assistant
      - Abode
      - Google Calendar API
      - Google Ads API
      - Meta Marketing API
      - Nuxt Studio
    integration_contracts:
      square_customer_phone: "Phone values are normalized to E.164 or omitted before Square customer search/create/update calls."
      square_admin_member_charges: "Admin-only member repair/damage charges use Square saved cards through admin_member_charges and stay separate from credit top-ups, memberships, and expenses."
      fomailer_event_types: "Registry-backed sends include account.signup plus booking, membership, credit, hold, admin member charge receipt, contact, reminder, and broadcast events."
      access_incident_mail: "Lock/access incident alerts are best-effort and route through mailing.memberBroadcast to configured admin recipients."
      access_dead_job_retry: "Dashboard admins can return dead lock_access_jobs to pending with a required reason; the route conditionally updates dead rows and stores requester/prior-error audit context in payload."
      access_provider_verification: "Home Assistant lock writes require a healthy lock entity and physical user-code slot read-back; successful recovery clears stale job errors and resolves matching lock-sync incidents."
      access_scheduler: "Supabase pg_cron + pg_net is the authoritative once-per-minute caller. Atomic job claims make rollout overlap safe; the Home Assistant scheduler is disabled fallback only."
      abode_idempotency: "Alarm automation reads current state first and treats an already-satisfied arm/disarm request as success."
      app_error_reporting: "Nitro app-error reporting writes actionable failures to app_error_events/groups while filtering expected non-internal auth denials and static/bot 404 probes."
      authorization_role_source: "Admin authorization trusts Supabase app_metadata only; user_metadata is not an authorization source."
      booking_data_api: "Public/member occupancy is served through sanitized application routes. Direct booking/hold writes are denied to anon/authenticated Data API roles and restricted burn RPCs are service-role only."
      booking_rate_atomicity: "Booking creation, credit burn, booking_rate_kind, and rate_policy_snapshot are committed by one service-role RPC transaction."
      rich_html_safety: "Waiver HTML is allowlist-sanitized before storage and rendering."
      browser_security: "Production responses set CSP/HSTS/frame/MIME/referrer/permissions headers; Google Ads browser measurement requires explicit consent."
      public_rate_limits: "Signup, checkout-signup, password recovery, and contact use process-local hashed IP/identifier limits; edge controls remain recommended for multi-dyno abuse protection."
      guest_booking_policy: "Guest booking rules are system_config-owned; the current access-window value and application fallback are 09:00-21:00 America/Los_Angeles."
      homepage_marketing_policy: "GET /api/site/important-bits exposes safe live non-member, standby, entry-membership, and one admin-featured promo summary; promo display remains date, scope, redemption, and Square-link gated."
      link_creation_timestamps: "The compatibility migration copy mirrors links.created_at and links_archive.created_at; fosupabase owns the authoritative schema contract."
      download_link_worker_compatibility: "The compatibility migration copy includes service-only, one-active-request-per-order link_worker_requests and replace_link_for_worker for schema parity. Fostudio does not read, write, or execute this dashboard-to-NAS contract."
      service_instance_heartbeat_compatibility: "The compatibility migration copy includes the SECURITY INVOKER, service-role-only service_instance_heartbeats_current view for schema parity. Fostudio does not consume PhaseTwo topology heartbeat data."
      dashboard_order_note_counts_compatibility: "The compatibility migration copy includes the SECURITY INVOKER, service-role-only count_order_note_events(bigint[]) aggregate and partial order.note.added index for schema parity. Fostudio does not consume this dashboard contract."
  background_jobs:
    access_worker:
      endpoint: "/api/internal/access/process"
      schedule: "Every minute via Supabase pg_cron + pg_net"
      auth: "x-access-key using ACCESS_AUTOMATION_SHARED_KEY from Vault"
      responsibilities:
        - atomically claim and process due lock access jobs
        - verify Home Assistant lock writes against physical user-code slots
        - health-gate bounded recovery of still-relevant dead jobs
      config:
        - ACCESS_PROCESSOR_URL
    calendar_maintenance:
      endpoint: "/api/internal/calendar/maintenance"
      schedule: "Every 5 minutes via Supabase pg_cron + pg_net"
      auth: "x-access-key using ACCESS_AUTOMATION_SHARED_KEY from Vault"
      responsibilities:
        - reconcile bounded batches of stale guest payments with Square before releasing reservations
        - delete unpaid expired Square checkout links and expire their top-up sessions
        - run throttled Google Calendar synchronization
      config:
        - CALENDAR_MAINTENANCE_URL
    rollout_order:
      - apply additive booking rate RPC migration
      - deploy application routes and RPC caller
      - apply booking Data API RLS lockdown
      - enable calendar maintenance cron
  owned_operational_tables:
    - bookings
    - booking_holds
    - memberships
    - membership_credit_grants
    - membership_checkout_sessions
    - lock_access_jobs
    - lock_access_incidents
    - lock_permanent_codes
    - lock_slot_assignments
    - admin_member_charges
    - analytics_outputs
    - analytics_ad_daily
  contacts:
    owner: unknown
    note: "No explicit owner/contact file found in repo."
