hero:
  kicker: Availability
  title: Check real studio availability before you create an account.
  description: Occupied blocks come from the public calendar feed. Select an eligible open guest time to carry it into signup, or compare memberships for 24/7 access and longer planning reach.
nextMovePanel:
  title: Guest or member?
  points:
    - Guest booking is for one-off sessions and follows the live guest window, hours, minimum duration, and checkout rate.
    - Membership is for recurring production and adds 24/7 access, 30-minute booking increments, tier-based planning reach, and included benefits.
  primaryCta:
    label: Sign up to book as a guest
    to: /signup?returnTo=/dashboard/book
  secondaryCta:
    label: Compare memberships
    to: /memberships
readingPanel:
  title: How to read this calendar
  points:
    - Warm blocks mark hold windows where a set stays built overnight.
    - Neutral or dark blocks are unavailable studio time; temporarily reserved blocks may reopen if checkout is not completed.
    - Peak shading changes credit use, not availability. A standby zone appears only when today's live policy identifies an eligible same-day opening.
seo:
  title: Studio Availability Calendar | FO Studio Los Angeles
  description: Check FO Studio availability, active booking blocks, and next steps to reserve the studio as a member or guest.
  keywords:
    - studio availability calendar
    - book photo studio los angeles
    - studio booking schedule
    - guest studio booking
    - membership calendar access
  canonicalPath: /calendar
  robots: index,follow,max-image-preview:large
