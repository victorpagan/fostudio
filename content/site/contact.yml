hero:
  kicker: Contact FO Studio
  title: Ask the studio team before you commit a client date.
  description: Use the form for membership fit, guest booking, equipment confirmation, tours, accessibility, or production-specific questions.
detailsPanel:
  title: Studio details
  intro: Public contact details and the studio address are listed here for planning and directions.
  items:
    - label: Email
      value: studio@lafilmlab.com
      detail: The fastest way to reach the LA Film Lab studio team.
    - label: Phone
      value: (323) 999-4300
      detail: Useful for shoot-day coordination and quick schedule questions.
    - label: Location
      value: FO Studio, 3131 N. San Fernando Rd., Los Angeles, CA 90065
      detail: Use the map below for directions and arrival planning.
formPanel:
  title: Send a message
  description: Share what you are planning, what you need help with, and how best to reach you back.
  submittedTitle: Message sent
  submittedBody: Your note is in the queue. We will reply to the email you provided as soon as we can.
  submitLabel: Send message
mapPanel:
  title: Find the studio
  description: Use the map for routing, parking planning, and shoot-day coordination.
followupPanel:
  title: What happens after you send
  body: The server sends your message to the studio inbox. Replies go to the email address entered in the form; no response-time guarantee is implied.
reasonsPanel:
  title: Best reasons to reach out
  items:
    - You are comparing memberships and want a quick recommendation.
    - You have a client date in mind and want to confirm the booking path.
    - You need to clarify equipment, access, or whether the room fits your production.
