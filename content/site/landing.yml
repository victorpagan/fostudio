infoCard:
  title: A production-ready studio without the usual line-item friction.
  body: FO Studio serves individual photographers through small-to-mid crews with a large shooting space, client seating, a makeup area, and an online booking workflow inside LA Film Lab.
  affordabilityNote: Ground-floor loading and parking outside the dense downtown grid make arrivals and resets more practical.
  features:
    - 25x30 ft cyclorama, 20+ ft ceilings, and an 800 sq ft shooting space
    - Account-based guest booking when you need one date before choosing a membership
    - Member sessions as short as 30 minutes for tests, pickups, and pre-lighting
    - Live calendar, booking management, extensions, and eligible overnight setup holds
spotlight:
  label: PRODUCTION FIRST VALUE
  title: Plan, book, and manage studio time without waiting for a rental quote.
  body: Members use a live booking dashboard and credits tied to their plan. Reserve from 30 minutes to a full production day, subject to calendar availability and the selected tier's booking window.
  statValue: 30 min
  statLabel: Minimum member booking increment
  cta:
    label: Compare memberships
    to: /memberships
tiersPreview:
  title: Membership tier preview
  subtitle: Start with the plan that matches your current volume. You can always move up as your schedule grows.
  items:
    - id: creator
      title: Creator
      body: A practical fit for lighter recurring volume, portfolio work, and smaller shoots.
      buttonLabel: See Creator pricing
    - id: pro
      title: Pro
      body: For repeat client production that needs a longer booking window and steadier monthly capacity.
      buttonLabel: See Pro pricing
    - id: studio_plus
      title: Studio+
      body: For heavier production schedules that need the longest planning reach and the largest credit allowance.
      buttonLabel: See Studio+ pricing
